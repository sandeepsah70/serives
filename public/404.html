<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Treta Enterprises - Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages single page app router redirect
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    Redirecting to Treta Enterprises Portal...
  </body>
</html>
